name: Build Overlap v0

on:
  pull_request:
    paths:
      - "social-scheduler-v0/**"
      - ".github/workflows/build-overlap.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-scheduler-v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
